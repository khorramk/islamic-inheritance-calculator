<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Inheritance & Wasiyyah Calculator</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --accent: #b45309;
            --accent-bg: #fef3c7;
            --badge-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 1rem 0.5rem;
            margin: 0;
        }

        @media (min-width: 640px) {
            body { padding: 2rem 1rem; }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .card { padding: 2rem; }
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        h2 {
            color: var(--primary);
            font-size: 1.15rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        @media (min-width: 480px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }

        input[type="number"], select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: 2px solid var(--primary);
            background: #fff;
        }

        .radio-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.25rem;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.25rem;
            font-size: 1rem;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 1.2rem;
            height: 1.2rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .alert {
            background-color: var(--accent-bg);
            border: 1px solid #f59e0b;
            color: var(--accent);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .hidden { display: none; }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .result-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 0.5rem;
        }

        .result-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
        }

        .result-amount {
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary);
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.75rem;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--text-light);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 500;
        }

        .badge-type {
            background: #e0f2fe;
            color: #0369a1;
        }

        .result-total-card {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-weight: bold;
        }
        
        .result-total-card span {
            color: #166534;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Islamic Inheritance Calculator</h1>
        
        <div id="validationAlert" class="alert hidden"></div>

        <form id="inheritanceForm" onsubmit="calculateEstate(event)">
            <h2>1. Estate & Bequests</h2>
            <div class="grid">
                <div class="form-group">
                    <label for="totalEstate">Total Estate Value (£/$)</label>
                    <input type="number" id="totalEstate" min="0" value="100000" required>
                </div>
                <div class="form-group">
                    <label for="debts">Funeral & Outstanding Debts</label>
                    <input type="number" id="debts" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="wills">Will Bequests (To non-heirs) amount in numbers</label>
                    <input type="number" id="wills" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="sadakah">Sadakah Jariyah / Charity</label>
                    <input type="number" id="sadakah" min="0" value="0">
                </div>
            </div>

            <h2>2. Methodology & Deceased Details</h2>
            <div class="grid">
                <div class="form-group">
                    <label for="madhabChoice">Jurisprudence (Madhab) View</label>
                    <select id="madhabChoice">
                        <option value="majority">Majority (Shafi'i / Maliki / Hanbali)</option>
                        <option value="hanafi">Hanafi Opinion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Gender of Deceased</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male" checked onchange="toggleSpouseInput()"> Male</label>
                        <label><input type="radio" name="gender" value="female" onchange="toggleSpouseInput()"> Female</label>
                    </div>
                </div>
            </div>

            <h2>3. Surviving Relatives</h2>
            <div class="grid">
                <div class="form-group" id="wifeGroup">
                    <label for="wivesCount">Number of Surviving Wives</label>
                    <input type="number" id="wivesCount" min="0" max="4" value="1">
                </div>
                <div class="form-group hidden" id="husbandGroup">
                    <label class="checkbox-group">
                        <input type="checkbox" id="husbandExists"> Husband is surviving
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="fatherExists" checked> Father is alive
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="grandfatherExists"> Paternal Grandfather is alive
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="motherExists" checked> Mother is alive
                    </label>
                </div>
                <div class="form-group">
                    <label for="sonsCount">Number of Sons</label>
                    <input type="number" id="sonsCount" min="0" value="1">
                </div>
                <div class="form-group">
                    <label for="daughtersCount">Number of Daughters</label>
                    <input type="number" id="daughtersCount" min="0" value="1">
                </div>
                <div class="form-group">
                    <label for="brothersCount">Number of Full Brothers</label>
                    <input type="number" id="brothersCount" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="sistersCount">Number of Full Sisters</label>
                    <input type="number" id="sistersCount" min="0" value="0">
                </div>
            </div>

            <button type="submit">Calculate Distribution</button>
        </form>
    </div>

    <!-- Output View Component -->
    <div id="resultCard" class="card hidden">
        <h1>Distribution Breakdown</h1>
        <div id="breakdownSummary"></div>
        
        <div class="results-list" id="mobileResultsContainer"></div>
        
        <div class="result-total-card">
            <span>Total Asset Pool</span>
            <span id="finalTotalDisplay">0.00</span>
        </div>
    </div>
</div>

<script>
function toggleSpouseInput() {
    const gender = document.querySelector('input[name="gender"]:checked').value;
    const wifeGroup = document.getElementById('wifeGroup');
    const husbandGroup = document.getElementById('husbandGroup');
    
    if (gender === 'male') {
        wifeGroup.classList.remove('hidden');
        husbandGroup.classList.add('hidden');
        document.getElementById('husbandExists').checked = false;
    } else {
        wifeGroup.classList.add('hidden');
        husbandGroup.classList.remove('hidden');
        document.getElementById('wivesCount').value = 0;
    }
}

function calculateEstate(event) {
    event.preventDefault();
    
    const alertBox = document.getElementById('validationAlert');
    alertBox.classList.add('hidden');
    
    const totalEstate = parseFloat(document.getElementById('totalEstate').value) || 0;
    const debts = parseFloat(document.getElementById('debts').value) || 0;
    let wills = parseFloat(document.getElementById('wills').value) || 0;
    let sadakah = parseFloat(document.getElementById('sadakah').value) || 0;
    
    if (debts > totalEstate) {
        alertBox.textContent = "Error: Debts exceed the total value of the estate. No assets left to distribute.";
        alertBox.classList.remove('hidden');
        return;
    }

    const netAfterDebts = totalEstate - debts;
    const requestedBequests = wills + sadakah;
    const maxBequestAllowed = netAfterDebts / 3;
    
    let bequestWarning = "";
    if (requestedBequests > maxBequestAllowed) {
        bequestWarning = `Note: The requested Will and Sadakah combined (${requestedBequests.toFixed(2)}) exceeded the maximum legal 1/3 threshold (${maxBequestAllowed.toFixed(2)}). They have been capped at 1/3 per Shariah rules unless all adult heirs manually consent.`;
        const ratio = maxBequestAllowed / requestedBequests;
        wills = wills * ratio;
        sadakah = sadakah * ratio;
    }

    const netFaraidEstate = netAfterDebts - (wills + sadakah);

    const madhab = document.getElementById('madhabChoice').value;
    const gender = document.querySelector('input[name="gender"]:checked').value;
    const wivesCount = parseInt(document.getElementById('wivesCount').value) || 0;
    const husbandExists = document.getElementById('husbandExists').checked;
    const fatherExists = document.getElementById('fatherExists').checked;
    const grandfatherExists = document.getElementById('grandfatherExists').checked;
    const motherExists = document.getElementById('motherExists').checked;
    const sonsCount = parseInt(document.getElementById('sonsCount').value) || 0;
    const daughtersCount = parseInt(document.getElementById('daughtersCount').value) || 0;
    
    let brothersCount = parseInt(document.getElementById('brothersCount').value) || 0;
    let sistersCount = parseInt(document.getElementById('sistersCount').value) || 0;

    const hasChildren = (sonsCount > 0 || daughtersCount > 0);

    // --- ADVANCED SIBLING EXCLUSION (HAJB) WITH JURISPRUDENCE OPTIONS ---
    let siblingsExcluded = false;
    let grandfatherActsAsFather = false;

    if (fatherExists || sonsCount > 0) {
        siblingsExcluded = true;
    }

    if (grandfatherExists && !fatherExists) {
        if (madhab === 'hanafi') {
            siblingsExcluded = true;
            grandfatherActsAsFather = true;
            bequestWarning += " [Hanafi View applied]: The surviving grandfather replaces the father line, blocking all siblings.";
        } else {
            grandfatherActsAsFather = false;
            if (brothersCount > 0 || sistersCount > 0) {
                bequestWarning += " [Majority View applied]: Grandfather shares the remaining residue dynamically with siblings via custom formulas.";
            }
        }
    }

    if (siblingsExcluded) {
        if (brothersCount > 0 || sistersCount > 0) {
            bequestWarning += " Note: Full brothers/sisters are completely excluded (Hajb) from the active inheritance share list.";
        }
        brothersCount = 0;
        sistersCount = 0;
    }

    let rows = [];
    
    if (debts > 0) rows.push({ name: "Debts & Funeral Liabilities", type: "Obligatory Liability", fraction: "Pre-Share Deduction", pct: (debts/totalEstate)*100, amt: debts });
    if (wills > 0) rows.push({ name: "Will Bequests (Wasiyyah)", type: "Voluntary Legacy", fraction: "Up to 1/3 limit", pct: (wills/totalEstate)*100, amt: wills });
    if (sadakah > 0) rows.push({ name: "Sadakah Jariyah Requests", type: "Voluntary Legacy", fraction: "Up to 1/3 limit", pct: (sadakah/totalEstate)*100, amt: sadakah });

    let fixedSharesTotal = 0;
    let mathAllocations = [];

    if (gender === 'male' && wivesCount > 0) {
        const wifeFraction = hasChildren ? (1/8) : (1/4);
        mathAllocations.push({ id: 'wives', name: `Wife/Wives (Shared between ${wivesCount})`, baseFraction: wifeFraction });
        fixedSharesTotal += wifeFraction;
    } else if (gender === 'female' && husbandExists) {
        const husbandFraction = hasChildren ? (1/4) : (1/2);
        mathAllocations.push({ id: 'husband', name: "Husband", baseFraction: husbandFraction });
        fixedSharesTotal += husbandFraction;
    }

    if (motherExists) {
        const totalSiblings = brothersCount + sistersCount;
        const motherFraction = (hasChildren || totalSiblings >= 2) ? (1/6) : (1/3);
        mathAllocations.push({ id: 'mother', name: "Mother", baseFraction: motherFraction });
        fixedSharesTotal += motherFraction;
    }

    if (fatherExists || grandfatherActsAsFather) {
        const primaryMaleAscendantFraction = hasChildren ? (1/6) : 0; 
        if (primaryMaleAscendantFraction > 0) {
            const displayName = fatherExists ? "Father (Fixed Share)" : "Grandfather (Hanafi Fixed Share)";
            mathAllocations.push({ id: 'father', name: displayName, baseFraction: primaryMaleAscendantFraction });
            fixedSharesTotal += primaryMaleAscendantFraction;
        }
    }

    let sistersHaveFixedShare = false;
    if (!siblingsExcluded && !grandfatherExists && brothersCount === 0 && sistersCount > 0 && !hasChildren) {
        sistersHaveFixedShare = true;
        const sisterFraction = (sistersCount === 1) ? (1/2) : (2/3);
        mathAllocations.push({ id: 'sisters-fixed', name: "Full Sister(s) Fixed Allotment", baseFraction: sisterFraction });
        fixedSharesTotal += sisterFraction;
    }

    let scaleFactor = 1.0;
    if (fixedSharesTotal > 1.0) {
        scaleFactor = 1.0 / fixedSharesTotal;
        bequestWarning += " Proportional reduction (Awl) was applied because the total Quranic fractions exceeded 1.0.";
    }

    let distributedFaraidAmount = 0;
    mathAllocations.forEach(alloc => {
        const finalFraction = alloc.baseFraction * scaleFactor;
        const totalAllocAmt = netFaraidEstate * finalFraction;
        distributedFaraidAmount += totalAllocAmt;

        rows.push({
            name: alloc.name,
            type: "Quranic Fixed Heir",
            fraction: `Base Share: ${formatFraction(alloc.baseFraction)}`,
            pct: (totalAllocAmt / totalEstate) * 100,
            amt: totalAllocAmt
        });
    });

    let residueLeft = netFaraidEstate - distributedFaraidAmount;
    if (residueLeft < 0.01) residueLeft = 0;

    if (residueLeft > 0) {
        if (sonsCount > 0 || daughtersCount > 0) {
            const totalParts = (sonsCount * 2) + (daughtersCount * 1);
            const partValue = residueLeft / totalParts;

            if (sonsCount > 0) {
                const totalSonsAmt = partValue * 2 * sonsCount;
                rows.push({ name: `Sons (${sonsCount})`, type: "Residuary Heir", fraction: "2:1 Child Ratio", pct: (totalSonsAmt / totalEstate) * 100, amt: totalSonsAmt });
            }
            if (daughtersCount > 0) {
                const totalDaughtersAmt = partValue * 1 * daughtersCount;
                rows.push({ name: `Daughters (${daughtersCount})`, type: "Residuary Heir", fraction: "1:1 Child Ratio", pct: (totalDaughtersAmt / totalEstate) * 100, amt: totalDaughtersAmt });
            }
        } else if (fatherExists) {
            rows.push({ name: "Father (Asabah Residuary)", type: "Residuary Heir", fraction: "Absorbs Remaining Residue", pct: (residueLeft / totalEstate) * 100, amt: residueLeft });
        } else {
            const grandfatherSharingInResidue = (grandfatherExists && !grandfatherActsAsFather);
            
            if (grandfatherSharingInResidue || brothersCount > 0 || (sistersCount > 0 && !sistersHaveFixedShare)) {
                let gfResidueAmt = 0;
                let siblingResiduePool = residueLeft;

                if (grandfatherSharingInResidue) {
                    const flatOneSixthOption = netFaraidEstate / 6;
                    const muqasamahParts = 2 + (brothersCount * 2) + (sistersCount * 1);
                    const muqasamahOption = (residueLeft / muqasamahParts) * 2;
                    
                    if (flatOneSixthOption > muqasamahOption) {
                        gfResidueAmt = flatOneSixthOption;
                        if (gfResidueAmt > residueLeft) gfResidueAmt = residueLeft;
                        siblingResiduePool = residueLeft - gfResidueAmt;
                        rows.push({ name: "Grandfather (Majority 1/6 Floor)", type: "Residuary Ascendant", fraction: "Guaranteed 1/6 Minimum Allotment", pct: (gfResidueAmt / totalEstate) * 100, amt: gfResidueAmt });
                    } else {
                        gfResidueAmt = muqasamahOption;
                        siblingResiduePool = residueLeft - gfResidueAmt;
                        rows.push({ name: "Grandfather (Muqasamah Split)", type: "Residuary Ascendant", fraction: "Shares residue with siblings like a brother", pct: (gfResidueAmt / totalEstate) * 100, amt: gfResidueAmt });
                    }
                }

                if (siblingResiduePool > 0 && (brothersCount > 0 || sistersCount > 0)) {
                    const siblingParts = (brothersCount * 2) + (sistersCount * 1);
                    if (siblingParts > 0) {
                        const siblingPartValue = siblingResiduePool / siblingParts;
                        if (brothersCount > 0) {
                            const totalBrothersAmt = siblingPartValue * 2 * brothersCount;
                            rows.push({ name: `Full Brothers (${brothersCount})`, type: "Residuary Sibling", fraction: "2:1 Sibling Ratio", pct: (totalBrothersAmt / totalEstate) * 100, amt: totalBrothersAmt });
                        }
                        if (sistersCount > 0) {
                            const totalSistersAmt = siblingPartValue * 1 * sistersCount;
                            rows.push({ name: `Full Sisters (${sistersCount})`, type: "Residuary Sibling", fraction: "1:1 Sibling Ratio", pct: (totalSistersAmt / totalEstate) * 100, amt: totalSistersAmt });
                        }
                    }
                } else if (siblingResiduePool > 0 && grandfatherSharingInResidue) {
                    rows[rows.length - 1].amt += siblingResiduePool;
                    rows[rows.length - 1].pct = (rows[rows.length - 1].amt / totalEstate) * 100;
                }
                
            } else if (grandfatherExists && grandfatherActsAsFather === false) {
                rows.push({ name: "Grandfather (Asabah Residuary)", type: "Residuary Heir", fraction: "Absorbs Residue Pool", pct: (residueLeft / totalEstate) * 100, amt: residueLeft });
            } else {
                const nonSpouseRows = rows.filter(r => r.type.includes("Quranic") && !r.name.includes("Wife") && !r.name.includes("Husband"));
                if (nonSpouseRows.length > 0) {
                    bequestWarning += " Surplus residue returned to primary blood relations via Radd mechanism.";
                    nonSpouseRows.forEach(r => {
                        r.amt += (residueLeft / nonSpouseRows.length);
                        r.pct = (r.amt / totalEstate) * 100;
                    });
                }
            }
        }
    }

    const summaryContainer = document.getElementById('breakdownSummary');
    summaryContainer.innerHTML = bequestWarning ? `<div class="alert">${bequestWarning}</div>` : '';
    summaryContainer.innerHTML += `
        <p style="font-size:0.9rem; margin-bottom: 1rem; color: var(--text-light)">
            <strong>Initial Estate Pool:</strong> ${totalEstate.toLocaleString(undefined, {minimumFractionDigits: 2})}<br>
            <strong>Net Heritage Pool (Faraid):</strong> ${netFaraidEstate.toLocaleString(undefined, {minimumFractionDigits: 2})}
        </p>
    `;

    const cardContainer = document.getElementById('mobileResultsContainer');
    cardContainer.innerHTML = "";
    
    rows.forEach(row => {
        const item = document.createElement('div');
        item.className = "result-item";
        item.innerHTML = `
            <div class="result-header">
                <span class="result-title">${row.name}</span>
                <span class="result-amount">${row.amt.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
            </div>
            <div class="result-meta">
                <span class="badge badge-type">${row.type}</span>
                <span class="badge">${row.fraction}</span>
                <span class="badge">${row.pct.toFixed(2)}% of Gross</span>
            </div>
        `;
        cardContainer.appendChild(item);
    });

    document.getElementById('finalTotalDisplay').textContent = totalEstate.toLocaleString(undefined, {minimumFractionDigits: 2});
    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

function formatFraction(num) {
    if (num === 0.5) return "1/2";
    if (num === 0.25) return "1/4";
    if (num === 0.125) return "1/8";
    if (num === 0.3333333333333333) return "1/3";
    if (num === 0.16666666666666666) return "1/6";
    return num.toFixed(3);
}
</script>

</body>
</html>
